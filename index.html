<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cronómetro para debates escolares con múltiples fases y soporte multiidioma">
    <meta name="keywords" content="cronómetro, debate escolar, timer, ikasNOVA">
    <meta name="author" content="ikasNOVA">
    <title>Debate Escolar - ikasNOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: linear-gradient(135deg, #5B4A9E 0%, #4A9E9E 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .main-title {
            font-size: 52px;
            font-weight: 700;
            color: #5B4A9E;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 28px;
            font-weight: 400;
            color: #4A9E9E;
            margin-bottom: 15px;
        }

        .language-selector {
            margin-top: 15px;
        }

        .language-selector button {
            background: #5B4A9E;
            color: white;
            border: none;
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            transition: all 0.3s;
        }

        .language-selector button:hover {
            background: #4A9E9E;
            transform: translateY(-2px);
        }

        .language-selector button.active {
            background: #4A9E9E;
        }

        .config-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto 30px;
        }

        .config-panel h3 {
            color: #5B4A9E;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .team-config {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .team-input-group {
            display: flex;
            flex-direction: column;
        }

        .team-input-group label {
            color: #5B4A9E;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .team-input-group input {
            padding: 10px 15px;
            border: 2px solid #5B4A9E;
            border-radius: 5px;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 16px;
        }

        .config-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab-button {
            background: white;
            color: #5B4A9E;
            border: 2px solid #5B4A9E;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background: #5B4A9E;
            color: white;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #5B4A9E 0%, #4A9E9E 100%);
            color: white;
            border-color: #4A9E9E;
        }

        .timer-container {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            max-width: 800px;
            margin: 0 auto;
        }

        .timer-container.active {
            display: block;
        }

        .timer-title {
            text-align: center;
            color: #5B4A9E;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .participant-name {
            text-align: center;
            color: #4A9E9E;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            font-style: italic;
        }

        .timer-display {
            text-align: center;
            font-size: 120px;
            font-weight: 700;
            color: #4A9E9E;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: color 0.3s ease;
        }

        .timer-config {
            text-align: center;
            margin-bottom: 20px;
        }

        .timer-config label {
            color: #5B4A9E;
            font-weight: 700;
            font-size: 18px;
            margin-right: 10px;
        }

        .timer-config input {
            padding: 8px 15px;
            border: 2px solid #5B4A9E;
            border-radius: 5px;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 16px;
            width: 80px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(135deg, #5B4A9E 0%, #4A9E9E 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .export-btn {
            background: #6080A3;
        }

        .export-btn:hover {
            background: #4d6782;
        }

        .timer-display.warning {
            color: #ff9800;
            animation: pulse 1s infinite;
        }

        .timer-display.negative {
            color: #ff0000;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse-red {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        @media (max-width: 768px) {
            .timer-display {
                font-size: 80px;
            }
            
            .control-btn {
                padding: 12px 25px;
                font-size: 16px;
            }

            .team-config {
                grid-template-columns: 1fr;
            }

            .main-title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="main-title" id="mainTitle">Debate Escolar</div>
        <div class="subtitle">ikasNOVA</div>
        <div class="language-selector">
            <button onclick="changeLanguage('es')" class="active" id="lang-es">Español</button>
            <button onclick="changeLanguage('en')" id="lang-en">English</button>
            <button onclick="changeLanguage('eu')" id="lang-eu">Euskera</button>
        </div>
    </div>

    <div class="config-panel" id="configPanel">
        <h3 id="configTitle">Configuración de Participantes</h3>
        <div class="team-config">
            <div class="team-input-group">
                <label id="labelTeamA">Equipo / Participante A:</label>
                <input type="text" id="teamA" placeholder="Nombre del equipo A">
            </div>
            <div class="team-input-group">
                <label id="labelTeamB">Equipo / Participante B:</label>
                <input type="text" id="teamB" placeholder="Nombre del equipo B">
            </div>
        </div>
        <div class="config-buttons">
            <button class="control-btn" onclick="startDebate()" id="startDebateBtn">Iniciar Debate</button>
        </div>
    </div>

    <div id="mainContent" style="display: none;">
        <div class="tabs-container" id="tabsContainer"></div>
        <div id="timersContainer"></div>
        <div class="controls" style="margin-top: 30px;">
            <button class="control-btn export-btn" onclick="exportToCSV()" id="exportBtn">📊 Exportar Tiempos a CSV</button>
        </div>
    </div>

    <script>
        // Traducciones
        const translations = {
            es: {
                mainTitle: "Debate Escolar",
                configTitle: "Configuración de Participantes",
                labelTeamA: "Equipo / Participante A:",
                labelTeamB: "Equipo / Participante B:",
                placeholderA: "Nombre del equipo A",
                placeholderB: "Nombre del equipo B",
                startDebate: "Iniciar Debate",
                intro1: "Introducción Equipo A",
                intro2: "Introducción Equipo B",
                ref1_1: "Refutación 1 Equipo A",
                ref1_2: "Refutación 1 Equipo B",
                ref2_1: "Refutación 2 Equipo A",
                ref2_2: "Refutación 2 Equipo B",
                concl1: "Conclusión Equipo A",
                concl2: "Conclusión Equipo B",
                initialMinutes: "Valor inicial (minutos):",
                start: "Iniciar",
                pause: "Pausar",
                reset: "Reiniciar",
                export: "📊 Exportar Tiempos a CSV",
                timeFinished: "¡Tiempo finalizado para",
                enterNames: "Por favor, introduce los nombres de ambos equipos o participantes."
            },
            en: {
                mainTitle: "School Debate",
                configTitle: "Participant Configuration",
                labelTeamA: "Team / Participant A:",
                labelTeamB: "Team / Participant B:",
                placeholderA: "Team A name",
                placeholderB: "Team B name",
                startDebate: "Start Debate",
                intro1: "Introduction Team A",
                intro2: "Introduction Team B",
                ref1_1: "Rebuttal 1 Team A",
                ref1_2: "Rebuttal 1 Team B",
                ref2_1: "Rebuttal 2 Team A",
                ref2_2: "Rebuttal 2 Team B",
                concl1: "Conclusion Team A",
                concl2: "Conclusion Team B",
                initialMinutes: "Initial value (minutes):",
                start: "Start",
                pause: "Pause",
                reset: "Reset",
                export: "📊 Export Times to CSV",
                timeFinished: "Time finished for",
                enterNames: "Please enter the names of both teams or participants."
            },
            eu: {
                mainTitle: "Eskola Eztabaida",
                configTitle: "Parte-hartzaileen Konfigurazioa",
                labelTeamA: "A Taldea / Parte-hartzailea:",
                labelTeamB: "B Taldea / Parte-hartzailea:",
                placeholderA: "A taldearen izena",
                placeholderB: "B taldearen izena",
                startDebate: "Eztabaida Hasi",
                intro1: "Sarrera A Taldea",
                intro2: "Sarrera B Taldea",
                ref1_1: "Ezeztapena 1 A Taldea",
                ref1_2: "Ezeztapena 1 B Taldea",
                ref2_1: "Ezeztapena 2 A Taldea",
                ref2_2: "Ezeztapena 2 B Taldea",
                concl1: "Ondorioa A Taldea",
                concl2: "Ondorioa B Taldea",
                initialMinutes: "Hasierako balioa (minutuak):",
                start: "Hasi",
                pause: "Gelditu",
                reset: "Berrezarri",
                export: "📊 Denbora CSV-ra Esportatu",
                timeFinished: "Denbora amaitu da",
                enterNames: "Mesedez, sartu bi talde edo parte-hartzaileen izenak."
            }
        };

        let currentLang = 'es';
        let timers = [];
        let teamNames = { A: '', B: '' };
        let timerLogs = {};
        
        // Configuración de los cronómetros
        const timerConfigs = [
            { id: 'intro1', defaultMinutes: 3, team: 'A' },
            { id: 'intro2', defaultMinutes: 3, team: 'B' },
            { id: 'ref1_1', defaultMinutes: 4, team: 'A' },
            { id: 'ref1_2', defaultMinutes: 4, team: 'B' },
            { id: 'ref2_1', defaultMinutes: 4, team: 'A' },
            { id: 'ref2_2', defaultMinutes: 4, team: 'B' },
            { id: 'concl1', defaultMinutes: 3, team: 'A' },
            { id: 'concl2', defaultMinutes: 3, team: 'B' }
        ];

        // Inicializar cronómetros
        timerConfigs.forEach(config => {
            timers[config.id] = {
                seconds: config.defaultMinutes * 60,
                initialSeconds: config.defaultMinutes * 60,
                running: false,
                interval: null,
                timeUsed: 0,
                team: config.team,
                overtime: false,
                alertShown: false
            };
            timerLogs[config.id] = {
                phase: config.id,
                team: config.team,
                initialTime: config.defaultMinutes * 60,
                timeUsed: 0,
                overtime: 0,
                completed: false
            };
        });

        function changeLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.language-selector button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`lang-${lang}`).classList.add('active');
            
            document.getElementById('mainTitle').textContent = translations[currentLang].mainTitle;
            document.getElementById('configTitle').textContent = translations[currentLang].configTitle;
            document.getElementById('labelTeamA').textContent = translations[currentLang].labelTeamA;
            document.getElementById('labelTeamB').textContent = translations[currentLang].labelTeamB;
            document.getElementById('teamA').placeholder = translations[currentLang].placeholderA;
            document.getElementById('teamB').placeholder = translations[currentLang].placeholderB;
            document.getElementById('startDebateBtn').textContent = translations[currentLang].startDebate;
            
            if (document.getElementById('mainContent').style.display !== 'none') {
                document.getElementById('exportBtn').textContent = translations[currentLang].export;
                renderInterface();
            }
        }

        function startDebate() {
            const teamA = document.getElementById('teamA').value.trim();
            const teamB = document.getElementById('teamB').value.trim();
            
            if (!teamA || !teamB) {
                alert(translations[currentLang].enterNames);
                return;
            }
            
            teamNames.A = teamA;
            teamNames.B = teamB;
            
            document.getElementById('configPanel').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            
            renderInterface();
        }

        function renderInterface() {
            const tabsContainer = document.getElementById('tabsContainer');
            const timersContainer = document.getElementById('timersContainer');
            
            tabsContainer.innerHTML = '';
            timersContainer.innerHTML = '';
            
            timerConfigs.forEach((config, index) => {
                const teamName = teamNames[config.team];
                
                const tabBtn = document.createElement('button');
                tabBtn.className = 'tab-button' + (index === 0 ? ' active' : '');
                tabBtn.textContent = translations[currentLang][config.id];
                tabBtn.onclick = () => switchTab(config.id);
                tabsContainer.appendChild(tabBtn);
                
                const timerDiv = document.createElement('div');
                timerDiv.className = 'timer-container' + (index === 0 ? ' active' : '');
                timerDiv.id = `timer-${config.id}`;
                timerDiv.innerHTML = `
                    <h2 class="timer-title">${translations[currentLang][config.id]}</h2>
                    <div class="participant-name">${teamName}</div>
                    <div class="timer-config">
                        <label>${translations[currentLang].initialMinutes}</label>
                        <input type="number" id="input-${config.id}" value="${config.defaultMinutes}" min="1" max="60" onchange="updateInitialTime('${config.id}')">
                    </div>
                    <div class="timer-display" id="display-${config.id}">${formatTime(timers[config.id].seconds)}</div>
                    <div class="controls">
                        <button class="control-btn" onclick="startTimer('${config.id}')">${translations[currentLang].start}</button>
                        <button class="control-btn" onclick="pauseTimer('${config.id}')">${translations[currentLang].pause}</button>
                        <button class="control-btn" onclick="resetTimer('${config.id}')">${translations[currentLang].reset}</button>
                    </div>
                `;
                timersContainer.appendChild(timerDiv);
            });
        }

        function switchTab(timerId) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            document.querySelectorAll('.timer-container').forEach(container => {
                container.classList.remove('active');
            });
            document.getElementById(`timer-${timerId}`).classList.add('active');
        }

        function formatTime(seconds) {
            const isNegative = seconds < 0;
            const absSeconds = Math.abs(seconds);
            const mins = Math.floor(absSeconds / 60);
            const secs = absSeconds % 60;
            const sign = isNegative ? '-' : '';
            return `${sign}${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay(timerId) {
            const display = document.getElementById(`display-${timerId}`);
            display.textContent = formatTime(timers[timerId].seconds);
            
            if (timers[timerId].seconds >= 0) {
                timers[timerId].timeUsed = timers[timerId].initialSeconds - timers[timerId].seconds;
                timerLogs[timerId].timeUsed = timers[timerId].timeUsed;
                timerLogs[timerId].overtime = 0;
            } else {
                timers[timerId].timeUsed = timers[timerId].initialSeconds;
                timerLogs[timerId].timeUsed = timers[timerId].initialSeconds;
                timerLogs[timerId].overtime = Math.abs(timers[timerId].seconds);
            }
            
            display.classList.remove('warning', 'negative');
            
            if (timers[timerId].seconds < 0) {
                display.classList.add('negative');
                timers[timerId].overtime = true;
            } else if (timers[timerId].seconds <= 30 && timers[timerId].seconds > 0) {
                display.classList.add('warning');
            }
        }

        function updateInitialTime(timerId) {
            const input = document.getElementById(`input-${timerId}`);
            const minutes = parseInt(input.value) || 1;
            timers[timerId].initialSeconds = minutes * 60;
            timerLogs[timerId].initialTime = minutes * 60;
            if (!timers[timerId].running) {
                timers[timerId].seconds = timers[timerId].initialSeconds;
                updateDisplay(timerId);
            }
        }

        function startTimer(timerId) {
            if (!timers[timerId].running) {
                timers[timerId].running = true;
                timers[timerId].interval = setInterval(() => {
                    timers[timerId].seconds--;
                    updateDisplay(timerId);
                    
                    if (timers[timerId].seconds === 0 && !timers[timerId].alertShown) {
                        const config = timerConfigs.find(c => c.id === timerId);
                        const teamName = teamNames[config.team];
                        alert(`${translations[currentLang].timeFinished} ${teamName}!`);
                        timers[timerId].alertShown = true;
                        timerLogs[timerId].completed = true;
                    }
                }, 1000);
            }
        }

        function pauseTimer(timerId) {
            timers[timerId].running = false;
            if (timers[timerId].interval) {
                clearInterval(timers[timerId].interval);
                timers[timerId].interval = null;
            }
        }

        function resetTimer(timerId) {
            pauseTimer(timerId);
            timers[timerId].seconds = timers[timerId].initialSeconds;
            timers[timerId].timeUsed = 0;
            timers[timerId].overtime = false;
            timers[timerId].alertShown = false;
            timerLogs[timerId].timeUsed = 0;
            timerLogs[timerId].overtime = 0;
            timerLogs[timerId].completed = false;
            updateDisplay(timerId);
        }

        function exportToCSV() {
            const now = new Date();
            const timestamp = now.toLocaleString('es-ES');
            
            let csv = 'Fase,Equipo/Participante,Tiempo Inicial (seg),Tiempo Usado (seg),Tiempo Extra (seg),Tiempo Total (mm:ss),Completado\n';
            
            timerConfigs.forEach(config => {
                const log = timerLogs[config.id];
                const teamName = teamNames[config.team];
                const phaseName = translations[currentLang][config.id];
                const timeUsedFormatted = formatTime(log.overtime > 0 ? -log.overtime : (log.initialTime - log.timeUsed));
                const completed = log.completed ? 'Sí' : 'No';
                
                csv += `"${phaseName}","${teamName}",${log.initialTime},${log.timeUsed},${log.overtime},"${timeUsedFormatted}","${completed}"\n`;
            });
            
            csv += '\n';
            ['A', 'B'].forEach(team => {
                const teamName = teamNames[team];
                const teamTimers = timerConfigs.filter(c => c.team === team);
                const totalTime = teamTimers.reduce((sum, config) => sum + timerLogs[config.id].timeUsed, 0);
                const totalOvertime = teamTimers.reduce((sum, config) => sum + timerLogs[config.id].overtime, 0);
                csv += `"TOTAL ${teamName}","${teamName}",,${totalTime},${totalOvertime},"${formatTime(totalTime + totalOvertime)}",\n`;
            });
            
            csv += `\n"Fecha/Hora","${timestamp}",,,,\n`;
            csv += `"Idioma","${currentLang.toUpperCase()}",,,,\n`;
            
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `cronometro_debate_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours()}${now.getMinutes()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Inicializar textos en el idioma por defecto
        changeLanguage('es');
    </script>
</body>
</html>
